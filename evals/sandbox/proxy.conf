# Egress allowlist for the agent container.
#
# WHY: the SWE-bench eval image ships the repo at base_commit with full network access
# (verified: github.com returns 200 from inside). An agent with bash can therefore fetch the
# upstream PR that fixes the issue instead of deriving the fix. That agent looks
# well-scaffolded and is cheating. The neuralnoise WIP measured exactly this failure with
# OpenCode reading hidden tests, and reported it as capability.
#
# The agent container is attached ONLY to an `internal` docker network, which has no route
# out. This proxy is the single door, and it opens for the model API and nothing else.

Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info

# Allow only the clients on the internal network.
Allow 0.0.0.0/0

# CONNECT is what HTTPS needs. Only these hosts get a tunnel — everything else is refused,
# including github.com, the GitHub API, PyPI, and any search engine.
ConnectPort 443

# Destination allowlist. Add a host here only with a reason, because every entry is a
# potential channel for the answer to leak in.
Filter "/etc/tinyproxy/allowlist.txt"
FilterURLs Off
FilterExtended On
FilterDefaultDeny Yes

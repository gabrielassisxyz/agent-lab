name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      # Pinned, not apt: `bin/ci` is meant to be the exact thing CI runs, and the
      # distro package is whatever ubuntu-latest happens to ship. The two drifted
      # apart and master went red for a week over one info-level finding that the
      # newer local shellcheck no longer reports - a failure nobody could reproduce
      # by running the gate. Bump this deliberately, and run the same version here.
      - name: Install shellcheck
        run: |
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          shellcheck --version
      - name: Run bin/ci
        run: bin/ci
